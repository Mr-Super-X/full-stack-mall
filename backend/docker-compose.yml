# 本地开发数据库；应用本体走本机 mvn spring-boot:run（本机已装 JDK17 + Maven 3.8.9）
services:
  mysql:
    image: mysql:8.4
    container_name: mall-mysql
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-mall-root}
      MYSQL_DATABASE: mall
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 4b 悲观锁对照组拐点可见性（spec §7/§13#18）：锁等待 5s 让 500 线程内爆掉；
      # 教学库常态生效——README 已声明"压测环境配置，生产含义另述"
      - --innodb-lock-wait-timeout=5
    volumes:
      - mall-mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # 4b 秒杀演进引入：Lua 预扣 + 令牌桶限流
  mall-redis:
    image: redis:7
    container_name: mall-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # 4b 秒杀演进引入：异步出单削峰；management 插件看队列/DLQ（作品集截图素材）
  mall-rabbit:
    image: rabbitmq:3.13-management
    container_name: mall-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mall-mysql-data:
