server:
  port: 18080
  servlet:
    context-path: /api

spring:
  application:
    name: mall-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:13306/mall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:mall-root}
  # 4b 秒杀演进：Redis（Lua 预扣/令牌桶）与 RabbitMQ（异步出单）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 命令超时 3s（对照表"Redis 挂"场景快速失败 40005 的前提——默认无超时会挂起到 TCP 超时，实测）
      timeout: 3s
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        # 消费者手动 ack（幂等/重试/DLX 语义由 SeckillOrderCreateConsumer 控制）
        acknowledge-mode: manual
        prefetch: 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
  mapper-locations: classpath*:mapper/*.xml

seckill:
  # 扣库存实现：optimistic（4a 默认）/ pessimistic（FOR UPDATE 对照组）/ redis（Lua+MQ 异步出单）
  # 压测期间按趟临时改此处默认值（Windows 下环境变量传 spring-boot:run 不可靠——实测两轮均失败）
  strategy: ${SECKILL_STRATEGY:optimistic}
  rate-limit:
    # 令牌桶初始值；按"DB 拐点并发 70%"压测校准后更新本注释（spec §6 证据链落字）
    capacity: ${SECKILL_RATE_CAPACITY:200}
    refill-per-second: ${SECKILL_RATE_REFILL:100}
  mq:
    # 故障注入：消费者落库失败率 0~1（仅压测/对照实验开启；>0 时启动 warn 日志）
    consumer-simulated-failure-rate: ${SECKILL_MQ_FAILURE_RATE:0}

app:
  cors:
    # 前端各 app dev server 端口 + dev-gateway；逗号分隔，环境变量可整体覆盖
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:8080}
  jwt:
    # 仅开发用默认值；生产必须通过 JWT_SECRET 环境变量覆盖
    secret: ${JWT_SECRET:dev-only-mall-jwt-secret-key-please-override-in-prod}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
    cookie-name: token
  payment:
    # 支付回调验签密钥（独立于 JWT 密钥，一端泄露不连带失守——终审 MEDIUM 修复）
    # 仅开发用默认值；生产必须通过 PAYMENT_SECRET 环境变量覆盖
    secret: ${PAYMENT_SECRET:dev-only-mall-payment-secret-please-override-in-prod}
